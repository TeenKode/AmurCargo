name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs, while separating PR validation from branch publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # Full browser/CAD tests must not delay a new validated offline HTML.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install -r requirements.txt ziglang==0.13.0
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Verify committed firmware and rebuild from source
        env:
          ARDUINO_DATA: /home/runner/.arduino15
          ARDUINO_SERVO: /home/runner/Arduino/libraries/Servo
        run: |
          export ZIG="$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')"
          python tools/rebuild_site.py
      - name: Test firmware and simulated missions
        run: |
          npm test
          g++ -std=c++17 -Itools/kit_host -Ifirmware/RadialRobot tools/test_radial_hardware.cpp -o "$RUNNER_TEMP/amur-hardware-test"
          "$RUNNER_TEMP/amur-hardware-test"
          g++ -std=c++17 -Itools/kit_host -Ifirmware/RadialRobot tools/test_shield_buzzer.cpp -o "$RUNNER_TEMP/amur-buzzer-test"
          "$RUNNER_TEMP/amur-buzzer-test"
          g++ -std=c++17 -Ifirmware/RadialRobot tools/test_line_following.cpp -o "$RUNNER_TEMP/amur-line-test"
          "$RUNNER_TEMP/amur-line-test"
          g++ -std=c++17 -Itools/kit_host -Ifirmware/RadialRobot tools/test_l298p_servo_timing.cpp -o "$RUNNER_TEMP/amur-timer-test"
          "$RUNNER_TEMP/amur-timer-test"
      - name: Test browser and CAD
        run: |
          node tools/test_serial_reconnect.cjs
          node tools/test_manual_usb.cjs
          node tools/test_servo_manual_usb.cjs
          node tools/test_manual_panel.cjs
          node tools/test_illustrated_guide.cjs
          node tools/test_offline_all.cjs
          python tools/test_reverse_nut.py
          python tools/test_removable_forks.py
          python tools/audit_current_simulator_model.py
      - name: Build ready-to-print archive
        run: |
          python tools/build_illustrated_assembly.py
          python tools/package_ready_only.py
      - uses: actions/upload-artifact@v4
        with:
          name: pogruzchik-ready
          path: outputs/Pogruzchik_Ready_R4_STL_HTML.zip
          if-no-files-found: error

  build_site:
    name: Build and validate current offline HTML
    # Every source push refreshes HTML, even while slow PR/CAD tests run.
    # Never publish if the firmware build or consistency checks fail.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install firmware toolchains
        run: |
          python -m pip install ziglang==0.13.0
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Rebuild firmware and offline HTML
        env:
          ARDUINO_DATA: /home/runner/.arduino15
        run: |
          export ZIG="$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')"
          python tools/rebuild_site.py
          python tools/verify_firmware_publication.py
          python tools/test_offline_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: amurcargo-firmware-and-site
          path: |
            simulator/Open_Simulation_3D.html
            simulator/Assembly_Guide_RU.html
            simulator/Purchase_List_RU.html
            tools/quick_guide_body.html
            tools/calibration_guide_body.html
            OFFLINE.html
            firmware/build/RadialRobot_UNO.hex
            firmware/build/RadialRobot_NANO.hex
            firmware/build/Firmware_Uno.bin
            firmware/build/Firmware_Nano.bin
            firmware/build/FirmwareCore.wasm
            firmware/build/FirmwareCore.json
            firmware/build/Flash_Image.json
            firmware/build/Flash_Image_Nano.json
            firmware/RadialRobot/RobotConfig.h
          if-no-files-found: error

  publish:
    name: Publish verified firmware and simulator to the branch
    needs: build_site
    # A PR may execute untrusted code; only trusted pushes can write back artifacts.
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: amurcargo-firmware-and-site
          path: .
      - name: Check firmware integrity and offline bundle contents
        run: |
          python tools/verify_firmware_publication.py
          python tools/test_offline_all.py
      - name: Commit generated files only when the verified branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::A newer commit exists; skip stale publication."
            exit 0
          fi
          git add -- firmware/RadialRobot/RobotConfig.h
          git add -f -- \
            simulator/Open_Simulation_3D.html \
            simulator/Assembly_Guide_RU.html \
            simulator/Purchase_List_RU.html \
            tools/quick_guide_body.html \
            tools/calibration_guide_body.html \
            OFFLINE.html \
            firmware/build/RadialRobot_UNO.hex \
            firmware/build/RadialRobot_NANO.hex \
            firmware/build/Firmware_Uno.bin \
            firmware/build/Firmware_Nano.bin \
            firmware/build/FirmwareCore.wasm \
            firmware/build/FirmwareCore.json \
            firmware/build/Flash_Image.json \
            firmware/build/Flash_Image_Nano.json
          if git diff --cached --quiet; then
            echo "Verified artifacts already match the branch."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: sync verified firmware and offline simulator [skip ci]"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
